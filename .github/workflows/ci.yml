name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build production container
        run: >-
          docker build
          --build-arg VITE_SUPABASE_URL=https://ci.supabase.co
          --build-arg VITE_SUPABASE_ANON_KEY=sb_publishable_ci_only
          --tag canvas-ai-website-builder:ci
          .

      - name: Check production dependencies
        run: npm audit --omit=dev
